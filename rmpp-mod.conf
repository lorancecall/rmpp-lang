# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-lang
type=vellum
package=rmpp-lang
default=1
addons=https://lorancecall.github.io/rmpp-packages/addons/rmpp-lang.txt
short_ko=언어: 언어별 키보드와 글꼴
short_en=Languages: keyboards and fonts per language
detail_ko=설정 > 언어: 언어별 키보드와 글꼴. 아래에서 언어를 고르세요(한국어:|화면·블루투스·USB·Type Folio 키보드로 한글 입력, Ctrl+Space 또는|오른쪽 Alt). 글꼴 추가: rmpp-lang font add 글꼴.ttf --lang ko
detail_en=Settings > Languages: keyboard and font per language. Pick the languages|below (Korean: type Hangul on the on-screen, Bluetooth, USB and Type Folio|keyboards, Ctrl+Space or right Alt). Add fonts: rmpp-lang font add.
