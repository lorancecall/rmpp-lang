# rmpp-mod.conf: how the rmpp installer lists and installs this mod.
# Format: https://github.com/lorancecall/rmpp-packages/blob/main/MODS.md
id=rmpp-korean
type=vellum
package=rmpp-korean
default=1
short_ko=한글 입력 (화면·외장 키보드)
short_en=Korean input (on-screen, keyboards)
detail_ko=화면 키보드에 한국어 자판과 한글 글꼴을 더합니다.|블루투스·USB·Type Folio 키보드로도 한글을 입력합니다|(Ctrl+Space 또는 오른쪽 Alt로 전환). 서식 막대에 한/EN 표시.
detail_en=Adds a Korean (Hangul) layout and fonts to the on-screen|keyboard. Type Korean on Bluetooth, USB and Type Folio|keyboards (Ctrl+Space or right Alt). 한/EN on the format bar.
