# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=ko
name=Korean
native=한국어
summary_en=Korean keyboard (2-beolsik) on screen and on Type Folio, Bluetooth and USB keyboards, Hanja, Old Hangul
summary_ko=한글 키보드(두벌식): 화면 키보드와 Type Folio·블루투스·USB 키보드, 한자, 옛한글
version=0.3.0
min_core=0.3.0
# Preselected in the installer menu
default=1
scripts=Hangul
han=1
# Hangul composition is built into the core
input=compose:hangul
# Hangul -> Hanja conversion: 漢 button on the format bar, Hanja or F9 key (dictionary: libhangul, BSD-3-Clause)
convert=hanja
convert_dict=dict/hanja.txt
layouts=ko_KR
# Shown on the language button of the keyboard's format bar
label=한
# Input methods (Settings > Languages > Korean > Input): old adds the 옛 palette on the format bar (archaic letters,
# initial clusters, Mandarin sibilants, 방점), composed into conjoining jamo that Noto Sans KR draws as syllables
methods=modern old
method_toggle=old
method_name.modern=현대 한글
method_name.old=옛한글
method_description=키보드 서식 막대의 옛 버튼으로 ㆍ ㅿ ㆆ ㆁ ㅸ, 옛 겹자음, 방점을 입력합니다. 자판의 글자와 함께 옛 음절로 조합됩니다.
label@old=옛
old_letters@old=1
rtl=0
# The OS ships Noto Sans KR (variable, /usr/share/fonts/ttf/noto); no font in the add-on
font=Noto Sans KR
families=Noto Sans KR
keyboard_name=2-beolsik
# Settings sample line: the opening of Hunminjeongeum (old Hangul jamo show whether a font composes them);
# sample_plain is shown for fonts that cannot compose old Hangul: the same line in modern Korean
sample=나랏말ᄊᆞ미 듕귁에 달아 · 國之語音 異乎中國
sample_plain=나라의 말이 중국과 달라 · 國之語音 異乎中國
