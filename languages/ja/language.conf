# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=ja
name=Japanese
native=日本語
summary_en=Japanese fonts, and Japanese typed in Hangul (도쿄 -> 東京) on the Korean keyboard
summary_ko=일본어 글꼴, 한글로 치는 일본어 (도쿄 -> 東京, 한국어 키보드 사용)
version=0.2.0
min_core=0.3.0
scripts=Hiragana Katakana
han=1
# Typed in Hangul on the Korean layout (needs the ko add-on); 変 / Hanja key / F9 converts the Hangul before
# the cursor: Hangul -> kana (dict/ja.map), kana -> words (dict/ja.txt, SKK-JISYO.L, GPL-2.0-or-later)
input=compose:hangul
layouts=ko_KR
requires=ko
keyboard_default=0
keyboard_name=Hangul reading (2-beolsik)
label=日
convert=kana
convert_dict=dict/ja.txt
convert_map=dict/ja.map
rtl=0
# The OS ships Noto Sans JP (variable, /usr/share/fonts/ttf/noto); Noto Sans CJK JP is offered when installed
font=Noto Sans JP
families=Noto Sans JP, Noto Sans CJK JP
sample=こんにちは、今日もよい一日を · 日本語 123
