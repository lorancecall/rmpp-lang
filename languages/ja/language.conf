# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=ja
name=Japanese
native=日本語
summary_en=Japanese fonts and typing: romaji (nihongo -> 日本語) or Hangul (니혼고 -> 日本語)
summary_ko=일본어 글꼴과 입력: 로마자(nihongo -> 日本語) 또는 한글(니혼고 -> 日本語)
version=0.2.0
min_core=0.3.0
scripts=Hiragana Katakana
han=1
# Input methods, chosen in Settings > Languages > Japanese > Input (first = default); key@method overrides key.
#  romaji: letters on the Latin layout (nihongo); Space (or 変 / F9) converts: romaji -> kana (dict/romaji.map),
#          kana -> words (dict/ja.txt, SKK-JISYO.L, GPL-2.0-or-later); Space picks the first candidate
#  hangul: the sounds in Hangul on the Korean layout (니혼고, needs ko); 変 / Hanja key / F9 converts:
#          Hangul -> kana (dict/ja.map)
methods=romaji hangul
method_name.romaji=ローマ字入力 (nihongo → 日本語)
method_name.hangul=ハングル入力 (니혼고 → 日本語)
input=layout
layouts=
keyboard_name=ローマ字（ラテン文字キーボード）
input@hangul=compose:hangul
layouts@hangul=ko_KR
requires@hangul=ko
keyboard_name@hangul=ハングル（2ボル式）
convert_map@hangul=dict/ja.map
# The package depends on ko (the Hangul method types on its layout)
requires=ko
requires@romaji=
keyboard_default=0
label=日
convert=kana
convert_dict=dict/ja.txt
convert_map=dict/romaji.map
rtl=0
# The OS ships Noto Sans JP (variable, /usr/share/fonts/ttf/noto); Noto Sans CJK JP is offered when installed
font=Noto Sans JP
families=Noto Sans JP, Noto Sans CJK JP
sample=こんにちは、今日もよい一日を · 日本語 123
