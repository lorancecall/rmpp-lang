# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=zh
name=Chinese
native=中文
summary_en=Chinese fonts, Simplified and Traditional, and Chinese typed in Hangul (중궈 -> 中国) on the Korean keyboard
summary_ko=중국어 글꼴(간체·번체), 한글로 치는 중국어 (중궈 -> 中国, 한국어 키보드 사용)
version=0.2.0
min_core=0.3.0
scripts=Bopomofo
han=1
# Typed in Hangul on the Korean layout (needs the ko add-on); 汉 / Hanja key / F9 converts the Hangul before
# the cursor: Hangul -> pinyin (dict/zh.map), pinyin -> words in Simplified Chinese (dict/zh.txt, rime LGPL-3.0,
# OpenCC Apache-2.0)
input=compose:hangul
layouts=ko_KR
requires=ko
keyboard_default=0
keyboard_name=Hangul reading (2-beolsik)
label=中
convert=pinyin
convert_dict=dict/zh.txt
convert_map=dict/zh.map
rtl=0
# The OS ships Noto Sans SC (variable); the CJK SC/TC families are offered when installed
font=Noto Sans SC
families=Noto Sans SC, Noto Sans CJK SC, Noto Sans CJK TC
sample=你好，祝你今天愉快 · 中文 漢字 123
