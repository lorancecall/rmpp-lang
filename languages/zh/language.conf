# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=zh
name=Chinese
native=中文
summary_en=Chinese fonts and typing: pinyin (zhongguo), Mandarin in Hangul (중궈) or Korean Hanja readings (중국)
summary_ko=중국어 글꼴(간체·번체)과 입력: 한글 발음(중궈), 병음(zhongguo), 한자음(중국) 중 선택
version=0.2.0
min_core=0.3.0
scripts=Bopomofo
han=1
# Input methods, chosen in Settings > Languages > Chinese > Input (first = default); key@method overrides key.
#  hangul: Mandarin sounds in Hangul on the Korean layout (needs ko); 汉 / Hanja key / F9 converts the Hangul
#          before the cursor: Hangul -> pinyin (dict/zh.map), pinyin -> words (dict/zh.txt, rime LGPL-3.0, OpenCC
#          Apache-2.0)
#  pinyin: letters on the Latin layout; Space (or 汉) converts, Space picks the first candidate
#  hanja:  Korean Hanja readings (중국) through the ko add-on's Hanja dictionary, Simplified first (dict/t2s.txt)
methods=pinyin hangul hanja
method_name.pinyin=拼音 (zhongguo → 中国)
method_name.hangul=韩文注音 (중궈 → 中国)
method_name.hanja=韩国汉字音 (중국 → 中国 / 中國)
input@pinyin=layout
layouts@pinyin=
requires@pinyin=
keyboard_name@pinyin=拼音（拉丁字母键盘）
convert_map@pinyin=
convert@hanja=hanja
convert_dict@hanja=@ko/dict/hanja.txt
convert_map@hanja=
convert_simplify@hanja=dict/t2s.txt
keyboard_name@hanja=韩国汉字音（韩文两套式）
input=compose:hangul
layouts=ko_KR
requires=ko
keyboard_default=0
keyboard_name=韩文注音（韩文两套式）
# Old letters narrow the Hangul method: ᅎ ᅔ ᄼ = z c s, ᅐ ᅕ ᄾ = zh ch sh, ㅿ = r, ㆄ = f (palette, long press, swipe)
old_letters=1
old_letters@pinyin=0
old_letters@hanja=0
label=中
convert=pinyin
convert_dict=dict/zh.txt
convert_map=dict/zh.map
rtl=0
# The OS ships Noto Sans SC (variable); the CJK SC/TC families are offered when installed
font=Noto Sans SC
families=Noto Sans SC, Noto Sans CJK SC, Noto Sans CJK TC
sample=你好，祝你今天愉快 · 中文 漢字 123
