# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=bg
name=Bulgarian
native=Български
summary_en=Bulgarian keyboards (BDS, phonetic) on screen and on Type Folio, Bluetooth and USB keyboards
summary_ko=불가리아어 키보드(BDS·표음식): 화면 키보드와 Type Folio·블루투스·USB 키보드
version=0.1.2
# keymap@<method> and keyboards@<method>/ (a layout per input method) need core 0.3.3
min_core=0.3.3
scripts=Cyrillic
han=0
input=layout
rtl=0
# reMarkable Sans and Noto Sans cover Cyrillic: no font shipped
font=
families=Noto Sans
sample=Здравейте, приятен ден · „Ѝ“ · 123
# Three layouts, chosen in Settings > Languages > Bulgarian > Input, for the physical keys (keymap@) and the
# on-screen keyboard (keyboards@<method>/ replaces keyboards/ while chosen; one "Bulgarian" entry in xochitl)
layouts=bg_BG
methods=bds phonetic traditional
method_name.bds=БДС
method_name.phonetic=Фонетична (нова)
method_name.traditional=Фонетична (традиционна)
keyboard_name@bds=БДС 5237:2006
keyboard_name@phonetic=Нова фонетична (БДС 5237:2006)
keyboard_name@traditional=Традиционна фонетична
keymap@bds=keymap.conf
keymap@phonetic=keymap-phonetic.conf
keymap@traditional=keymap-traditional.conf
# Stroke glyphs for text objects (tools/glyphs/glyphs.py; docs/DESIGN.md "Glyph files")
glyph_font=NotoSans
glyph_chars=cyrillic,punct
