# rmpp-lang language add-on (format: docs/DESIGN.md, "Language add-ons")
format=1
code=bg
name=Bulgarian
native=Български
summary_en=Bulgarian keyboards (BDS 5237:2006 and phonetic) on screen and on Type Folio, Bluetooth and USB keyboards
summary_ko=불가리아어 키보드(BDS·표음식): 화면 키보드와 Type Folio·블루투스·USB 키보드
version=0.1.0
# keymap@<method> and keyboards@<method>/ (a layout per input method) need core 0.3.3
min_core=0.3.3
scripts=Cyrillic
han=0
input=layout
rtl=0
# reMarkable Sans and Noto Sans cover Cyrillic: no font shipped
font=
families=Noto Sans
sample=Здравейте, приятен ден · „Ѝ“ · 123
# Two layouts, chosen in Settings > Languages > Bulgarian > Input, for the physical keys (keymap@) and the
# on-screen keyboard (keyboards@phonetic/ replaces keyboards/ while chosen; one "Bulgarian" entry in xochitl)
layouts=bg_BG
methods=bds phonetic
method_name.bds=БДС
method_name.phonetic=Фонетична
keyboard_name@bds=БДС 5237:2006
keyboard_name@phonetic=Фонетична (БДС 5237:2006)
keymap@bds=keymap.conf
keymap@phonetic=keymap-phonetic.conf
